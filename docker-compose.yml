services:
  # ==========================================================================
  # DATABASES
  # ==========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: webizon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webizon}
      POSTGRES_USER: ${POSTGRES_USER:-webizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webizon}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webizon} -d ${POSTGRES_DB:-webizon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - webizon-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: webizon-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-webizon_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping 2>/dev/null | grep -q Ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - webizon-net

  # ==========================================================================
  # CACHE / PUB-SUB
  # ==========================================================================

  redis:
    image: redis:7-alpine
    container_name: webizon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - webizon-net

  # ==========================================================================
  # MESSAGE BUS
  # ==========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: webizon-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - webizon-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: webizon-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "9093:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - webizon-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: webizon-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: webizon-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    networks:
      - webizon-net

  # ==========================================================================
  # REAL-TIME (CENTRIFUGO)
  # ==========================================================================

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: webizon-centrifugo
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - webizon-net

  # ==========================================================================
  # OBJECT STORAGE
  # ==========================================================================

  minio:
    image: minio/minio:latest
    container_name: webizon-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - webizon-net

  minio-setup:
    image: minio/mc:latest
    container_name: webizon-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/webizon-covers;
      mc mb --ignore-existing local/webizon-cta-files;
      mc mb --ignore-existing local/webizon-recordings;
      mc mb --ignore-existing local/webizon-invoices;
      mc anonymous set download local/webizon-covers;
      mc anonymous set download local/webizon-cta-files;
      echo 'MinIO buckets initialized';
      "
    networks:
      - webizon-net

  # ==========================================================================
  # AUTH (KEYCLOAK)
  # ==========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: webizon-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --http-port=8180
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: dev-file
      # Google IDP credentials — referenced as ${env.GOOGLE_CLIENT_ID} in realm JSON
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-CONFIGURE_ME}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-CONFIGURE_ME}
    ports:
      - "8180:8180"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8180 --realm master --user admin --password admin 2>/dev/null && echo ok || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks:
      - webizon-net

  # ==========================================================================
  # APPLICATION
  # ==========================================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webizon-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webizon}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webizon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webizon}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEBIZON_CENTRIFUGO_URL: http://centrifugo:8000
      WEBIZON_CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev_api_key_change_me}
      WEBIZON_CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev_hmac_secret_change_me}
      WEBIZON_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DB:-webizon_analytics}
      WEBIZON_MINIO_ENDPOINT: http://minio:9000
      # Public endpoint must use host.docker.internal so it is reachable from both
      # the backend container (MinIO SDK getBucketRegion call) AND the browser
      # (direct S3 PUT). host.docker.internal resolves to the host machine on
      # Docker Desktop; extra_hosts below ensures Linux Docker Engine also resolves it.
      # Production: override with MINIO_PUBLIC_ENDPOINT=https://storage.webizon.kz
      WEBIZON_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://host.docker.internal:9010}
      WEBIZON_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      WEBIZON_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8180/realms/webizon
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/webizon/protocol/openid-connect/certs
      WEBIZON_CORS_ALLOWED_ORIGINS: http://localhost:3001
    # Makes host.docker.internal resolve on Linux Docker Engine (Docker Desktop
    # already provides this; host-gateway = host machine IP in Docker Compose).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - webizon-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webizon-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api/backend
      NUXT_BACKEND_INTERNAL_URL: http://backend:8080
      NUXT_PUBLIC_CENTRIFUGO_URL: ws://localhost:8000/connection/websocket
      NUXT_PUBLIC_AUTH_SERVER: http://localhost:8180
      NUXT_PUBLIC_AUTH_CLIENT_ID: webizon-frontend
      NUXT_PUBLIC_AUTH_REALM: webizon
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - webizon-net

  # ==========================================================================
  # MONITORING
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: webizon-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - webizon-net

  grafana:
    image: grafana/grafana:latest
    container_name: webizon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-webizon}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - webizon-net

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  minio_data:
  keycloak_data:
  prometheus_data:
  grafana_data:

networks:
  webizon-net:
    driver: bridge
