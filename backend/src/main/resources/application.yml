spring:
  application:
    name: webizon-api

  threads:
    virtual:
      enabled: true

  main:
    banner-mode: off

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webizon}
    username: ${SPRING_DATASOURCE_USERNAME:webizon}
    password: ${SPRING_DATASOURCE_PASSWORD:webizon}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: WebizonHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        compression.type: snappy
    consumer:
      group-id: webizon-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.webizon.*"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/webizon}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/webizon/protocol/openid-connect/certs}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  tomcat:
    threads:
      max: 400
    max-connections: 10000
    accept-count: 1000

# ============================================================================
# WEBIZON-SPECIFIC CONFIG
# ============================================================================
webizon:
  centrifugo:
    url: ${WEBIZON_CENTRIFUGO_URL:http://localhost:8000}
    api-key: ${WEBIZON_CENTRIFUGO_API_KEY:dev_api_key_change_me}
    # HS256 requires ≥ 32 bytes. Dev default is long enough to pass the
    # runtime check in CentrifugoTokenSigner; prod MUST override via env.
    token-hmac-secret: ${WEBIZON_CENTRIFUGO_TOKEN_HMAC_SECRET:dev_hmac_secret_change_me_change_me_change_me_change_me}
    token-ttl-seconds: 900

  clickhouse:
    url: ${WEBIZON_CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/webizon_analytics}
    username: ${WEBIZON_CLICKHOUSE_USER:default}
    password: ${WEBIZON_CLICKHOUSE_PASSWORD:}

  minio:
    endpoint: ${WEBIZON_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${WEBIZON_MINIO_PUBLIC_ENDPOINT:http://localhost:9002}
    access-key: ${WEBIZON_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${WEBIZON_MINIO_SECRET_KEY:minioadmin}
    buckets:
      covers: webizon-covers
      cta-files: webizon-cta-files
      recordings: webizon-recordings
      invoices: webizon-invoices

  cors:
    allowed-origins: ${WEBIZON_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Public base URL of the frontend. Used to render invite accept links
  # in TENANT_INVITE emails (and any future transactional mail that
  # needs to deep-link into the app). Must NOT have a trailing slash.
  frontend:
    base-url: ${WEBIZON_FRONTEND_BASE_URL:http://localhost:3000}

  # Tenant invite lifecycle tuning.
  invites:
    # How long an invite link stays valid before the accept endpoint
    # returns 410 Gone. 7 days is the right default — long enough to
    # survive a weekend / holiday, short enough that a leaked link
    # from an archived email cannot be replayed a month later.
    ttl: 7d
    # Byte length of the random bearer token generated per invite.
    # 32 bytes = 256 bits of entropy → base64url-encoded to 43 chars.
    token-bytes: 32

  moderation:
    flood:
      max-messages: 5
      window-seconds: 10

  billing:
    rates:
      seat-live: 15
      seat-auto: 10
      storage-gb-month: 200
      payment-processing-percent: 3
    vat-percent: 12

  notifications:
    sender-name: ${WEBIZON_NOTIFICATIONS_SENDER_NAME:Webizon}
    sender-address: ${WEBIZON_NOTIFICATIONS_SENDER_ADDRESS:no-reply@webizon.kz}
    # Exponential back-off ladder. Index N is the delay before retry N+1.
    # Any attempt past the ladder length reuses the last rung as a ceiling.
    backoff:
      - 1m
      - 5m
      - 30m
      - 2h
      - 6h
    dispatch:
      tick-interval: 20s
      initial-delay: 15s
      batch-size: 100
      stale-sending-timeout: 5m
    # Session reminder sweeper — fans out EVENT_REMINDER
    # notifications for registered viewers N minutes before a
    # scheduled session's startTime. Lead-time is how far ahead
    # of the session the reminder fires; tick-interval is the
    # sweeper cadence (60s is plenty — the reminder window is
    # measured in minutes, not seconds).
    session-reminder:
      lead-time: 30m
      tick-interval: 60s
      initial-delay: 30s
    # Session-starting sweeper — fans out SESSION_STARTING
    # notifications the moment a session transitions to LIVE /
    # AUTO_LIVE. Tick-interval is aggressive (30s) so the "join
    # now" mail feels instant to the viewer; initial-delay
    # staggers startup so the two notification sweepers do not
    # wake on the same JVM tick.
    session-starting:
      tick-interval: 30s
      initial-delay: 20s

# ============================================================================
# MANAGEMENT / ACTUATOR
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: webizon-api
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

logging:
  level:
    root: INFO
    com.webizon: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{trace_id:-},%X{tenant_id:-}] %logger{36} - %msg%n"
